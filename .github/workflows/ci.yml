name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Load test (20 sessions × 100 players, p95 < 500 ms)
        run: |
          PORT=3001 LOG_LEVEL=warn SESSION_CREATE_LIMIT=1000 pnpm start &
          for i in $(seq 1 30); do curl -sf localhost:3001/api/health && break; sleep 1; done
          pnpm load -- --players 100 --sessions 20
